name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Allow manual trigger from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The Flutter project lives at the repo root (easy path) or under
    # easytier-flutter/. Auto-detect below.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Detect Flutter project directory
        id: proj
        shell: bash
        run: |
          if [ -f pubspec.yaml ]; then
            echo "proj=." >> "$GITHUB_OUTPUT"
          elif [ -f easytier-flutter/pubspec.yaml ]; then
            echo "proj=easytier-flutter" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find pubspec.yaml (repo root or ./easytier-flutter)"
            exit 1
          fi

      - name: Flutter version
        run: flutter --version

      - name: Configure Android local.properties
        shell: bash
        working-directory: ${{ steps.proj.outputs.proj }}
        run: |
          # Provide the SDK + Flutter paths Gradle needs. subosito/flutter-action
          # sets FLUTTER_ROOT; the runner exposes the Android SDK via ANDROID_HOME
          # (android-actions/setup-android). Write local.properties so our
          # settings.gradle.kts can resolve flutter.sdk regardless of action wiring.
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> android/local.properties
          echo "Written android/local.properties:"
          cat android/local.properties

      - name: Install dependencies
        working-directory: ${{ steps.proj.outputs.proj }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.proj.outputs.proj }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ steps.proj.outputs.proj }}
        run: flutter test

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.proj }}
        run: flutter build apk --debug

      - name: Build release APK
        working-directory: ${{ steps.proj.outputs.proj }}
        run: flutter build apk --release

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: easytier-debug-apk
          path: ${{ steps.proj.outputs.proj }}/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: easytier-release-apk
          path: ${{ steps.proj.outputs.proj }}/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 'EasyTier Flutter Client (latest)'
          body: |
            Android APK（Material 3 / astral 风格）。
            - Material 3 客户端：状态仪表盘、网络配置、节点/路由、设置。
            - FFI 真实核心 + Mock 模拟双后端。
          files: |
            ${{ steps.proj.outputs.proj }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ steps.proj.outputs.proj }}/build/app/outputs/flutter-apk/app-debug.apk
