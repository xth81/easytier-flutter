name: Build Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "**"
  pull_request:
    branches: [main, master]
  # Allow manual trigger from the Actions tab.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK (with NDK)
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable
          cache: true

      - name: Detect Flutter project directory
        id: proj
        shell: bash
        run: |
          if [ -f pubspec.yaml ]; then
            echo "proj=." >> "$GITHUB_OUTPUT"
          elif [ -f easytier-flutter/pubspec.yaml ]; then
            echo "proj=easytier-flutter" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Could not find pubspec.yaml (repo root or ./easytier-flutter)"
            exit 1
          fi

      - name: Flutter version
        run: flutter --version

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"

      - name: Set up Android Rust targets
        working-directory: ${{ steps.proj.outputs.proj }}/rust
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ steps.proj.outputs.proj }}/rust"

      - name: Build EasyTier Rust core (Android ABIs)
        working-directory: ${{ steps.proj.outputs.proj }}/rust
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=${ANDROID_NDK_HOME:-$ANDROID_HOME/ndk/26.1.10909125}"
          ./build.sh arm64-v8a armeabi-v7a x86_64

      - name: Configure Android local.properties
        shell: bash
        working-directory: ${{ steps.proj.outputs.proj }}
        run: |
          echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
          echo "sdk.dir=${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}" >> android/local.properties
          echo "Written android/local.properties:"
          cat android/local.properties

      - name: Install dependencies
        working-directory: ${{ steps.proj.outputs.proj }}
        run: flutter pub get

      - name: Analyze
        working-directory: ${{ steps.proj.outputs.proj }}
        run: flutter analyze

      - name: Test
        working-directory: ${{ steps.proj.outputs.proj }}
        run: flutter test

      - name: Build debug APK
        working-directory: ${{ steps.proj.outputs.proj }}
        run: flutter build apk --debug

      - name: Build release APK
        working-directory: ${{ steps.proj.outputs.proj }}
        run: flutter build apk --release --split-per-abi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: easytier-debug-apk
          path: ${{ steps.proj.outputs.proj }}/build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: easytier-release-apks
          path: |
            ${{ steps.proj.outputs.proj }}/build/app/outputs/flutter-apk/app-*-release.apk
            ${{ steps.proj.outputs.proj }}/build/app/outputs/flutter-apk/*.sha1

      - name: Publish GitHub Release (latest)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "EasyTier Flutter Client (latest)"
          body: |
            Android APK（Material 3 风格，内置官方 EasyTier Rust 核心）。

            - 真实核心：`easytier-android-jni` + `easytier-ffi` 由本 workflow
              用 cargo-ndk 交叉编译并打进 APK（arm64-v8a / armeabi-v7a / x86_64）。
            - `:vpn` 独立进程：`VpnService` 建 TUN → `runNetworkInstance` →
              `setTunFd`，与官方 Android 客户端相同的接法。
            - 配置校验、配置持久化、错误回显、自动连接、Magic DNS、出口节点、
              子网路由等生产功能。
            - 桌面/模拟器仍可回退到 Mock 后端预览 UI。
          files: |
            ${{ steps.proj.outputs.proj }}/build/app/outputs/flutter-apk/app-*-release.apk
            ${{ steps.proj.outputs.proj }}/build/app/outputs/flutter-apk/app-debug.apk
